services:
  db:
    image: postgres:16-alpine
    container_name: saf_teamleader_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: saf
      POSTGRES_PASSWORD: saf
      POSTGRES_DB: saf_teamleader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saf -d saf_teamleader"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: saf_teamleader_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://saf:saf@db:5432/saf_teamleader
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
    ports:
      - "3000:3000"

volumes:
  pgdata:
